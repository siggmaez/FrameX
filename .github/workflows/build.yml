name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  genkey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: keytool -genkeypair -keystore framex-debug.p12 -storetype PKCS12 -alias framex -keyalg RSA -keysize 2048 -validity 36500 -storepass framexdebug -keypass framexdebug -dname "CN=FrameX Debug,O=FrameX,C=US"
      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: framex-debug.p12
