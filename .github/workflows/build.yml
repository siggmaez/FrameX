name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build standard debug APK, release (R8) and run unit tests
        run: gradle assembleDebug assembleRelease testDebugUnitTest --stacktrace
      - name: Keep the standard APK
        run: mkdir -p dist && cp app/build/outputs/apk/debug/*.apk dist/FrameX-debug.apk
      - name: Lint (report only)
        continue-on-error: true
        run: gradle lintDebug --continue
      - name: Build "boost" APK (with the optional accessibility helper)
        run: gradle :app:assembleDebug -PwithA11y=true --stacktrace && cp app/build/outputs/apk/debug/*.apk dist/FrameX-boost-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: framex-debug-apk
          path: dist/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/tests
            **/build/reports/lint-results*.html
