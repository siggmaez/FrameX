name: Icon
on:
  workflow_dispatch:
  push:
    paths: [tools/icon.svg, .github/workflows/icon.yml]
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - run: |
          mkdir -p out
          rsvg-convert -w 512 -h 512 tools/icon.svg -o out/FrameX-icon-512.png
          rsvg-convert -w 1024 -h 1024 tools/icon.svg -o out/FrameX-icon-1024.png
      - uses: actions/upload-artifact@v4
        with:
          name: framex-icon
          path: out/*.png
